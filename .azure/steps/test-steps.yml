parameters:
  - name: tags
    type: string
  - name: reportSuffix
    type: string

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '22'
    displayName: Setup Node.js

  - script: npm ci
    displayName: Install dependencies

  - script: npx playwright install chromium --with-deps
    displayName: Install Playwright browsers

  - script: npx cucumber-js --tags "${{ parameters.tags }}"
    displayName: Run Cucumber tests (${{ parameters.tags }})
    env:
      GROQ_API_KEY: $(GROQ_API_KEY)
      AI_MODEL: $(AI_MODEL)
      CI: true
      REPORT_SUFFIX: ${{ parameters.reportSuffix }}

  - task: PublishPipelineArtifact@1
    condition: always()
    inputs:
      targetPath: reports/
      artifact: reports-${{ parameters.reportSuffix }}
    displayName: Publish report artifact
