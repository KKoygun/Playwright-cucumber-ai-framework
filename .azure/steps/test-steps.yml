parameters:
  - name: tags
    type: string
  - name: reportSuffix
    type: string

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '20'
    displayName: Setup Node.js

  - script: npm ci
    displayName: Install dependencies

  - script: npx playwright install chromium --with-deps
    displayName: Install Playwright browsers

  - script: |
      npx cucumber-js \
        --tags "${{ parameters.tags }}" \
        --format json:reports/cucumber-report-${{ parameters.reportSuffix }}.json \
        --format html:reports/cucumber-report-${{ parameters.reportSuffix }}.html \
        --format progress-bar
    displayName: Run Cucumber tests (${{ parameters.tags }})
    env:
      GROQ_API_KEY: $(GROQ_API_KEY)
      CI: true

  - task: PublishPipelineArtifact@1
    condition: always()
    inputs:
      targetPath: reports/
      artifact: reports-${{ parameters.reportSuffix }}
    displayName: Publish report artifact
