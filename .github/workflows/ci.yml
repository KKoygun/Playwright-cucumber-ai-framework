name: Playwright + Cucumber CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Typecheck + unit tests (providers run against a fake fetch, no keys) ────
  unit:
    name: Typecheck & unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Unit tests
        run: npm run test:unit

  # ── Healer eval (replays recorded responses, so no API keys) ────────────────
  eval-healer:
    name: Healer eval (replay)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run eval
        run: npm run eval:healer

      - name: Upload eval results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: healer-eval
          path: reports/eval/
          retention-days: 30

  # ── Test Matrix ─────────────────────────────────────────────────────────────
  # Runs tests in parallel across tag groups, simulating real-world CI sharding.
  # Each job is independent so a failure in one group doesn't block others.
  # @api tests skip the browser install step — no browser required for API tests.
  test:
    name: Tests [${{ matrix.tag }}]
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        tag:
          - '@smoke'
          - '@add'
          - '@complete'
          - '@filter or @delete or @clear or @edit'
          - '@a11y'
          - '@api'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        if: matrix.tag != '@api'
        run: npx playwright install chromium --with-deps

      - name: Run Cucumber tests
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CI: true
        run: npx cucumber-js --tags "${{ matrix.tag }}" --format json:reports/cucumber-report-${{ strategy.job-index }}.json --format html:reports/cucumber-report-${{ strategy.job-index }}.html --format progress-bar --format allure-cucumberjs/reporter

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-${{ strategy.job-index }}
          path: allure-results/
          retention-days: 7

      - name: Upload test report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-${{ matrix.tag }}
          path: reports/
          retention-days: 7

  # ── Merge Reports ───────────────────────────────────────────────────────────
  # Collects all shard artifacts and produces a single merged HTML + Allure report.
  merge-reports:
    name: Merge Reports
    needs: test
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download all report artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: report-*
          path: reports/
          merge-multiple: true

      - name: Download all Allure results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: allure-results/
          merge-multiple: true

      - name: Generate merged HTML report
        run: node scripts/generate-report.js

      - name: Generate Allure report
        run: npm run allure:generate

      - name: Upload merged HTML report
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report-merged
          path: reports/html/
          retention-days: 30

      - name: Upload Allure report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30
